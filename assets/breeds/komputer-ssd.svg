<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 140">
  <style>
    .bob { transform-box: fill-box; transform-origin: center bottom; animation: bob 2.6s ease-in-out infinite; }
    .wag { transform-box: fill-box; transform-origin: 20% 50%; animation: wag 1.15s ease-in-out infinite; }
    .blink { transform-box: fill-box; transform-origin: center; animation: blink 4.8s infinite; }
    @keyframes bob { 50% { transform: translateY(-3px); } }
    @keyframes wag { 50% { transform: rotate(14deg); } }
    @keyframes blink { 0%,42%,48%,100% { transform: scaleY(1);} 45% { transform: scaleY(.12);} }
    @media (prefers-reduced-motion: reduce) { .bob,.wag,.blink { animation: none; } }
  </style>
  <rect width="120" height="140" rx="28" fill="#12182e"/>
  <g class="bob"><rect x="34" y="40" width="52" height="52" rx="8" fill="#10283a" stroke="#ffe600" stroke-width="3"/>
    <rect x="46" y="52" width="28" height="28" rx="4" fill="#f7f4ea"/>
    <rect x="22" y="28" width="12" height="4" rx="1" fill="#ffe600"/><rect x="86" y="28" width="12" height="4" rx="1" fill="#ffe600"/><rect x="22" y="46" width="12" height="4" rx="1" fill="#ffe600"/><rect x="86" y="46" width="12" height="4" rx="1" fill="#ffe600"/><rect x="22" y="64" width="12" height="4" rx="1" fill="#ffe600"/><rect x="86" y="64" width="12" height="4" rx="1" fill="#ffe600"/><rect x="22" y="82" width="12" height="4" rx="1" fill="#ffe600"/><rect x="86" y="82" width="12" height="4" rx="1" fill="#ffe600"/>
    </g>
</svg>