<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 140">
  <style>
    .bob { transform-box: fill-box; transform-origin: center bottom; animation: bob 2.6s ease-in-out infinite; }
    .wag { transform-box: fill-box; transform-origin: 20% 50%; animation: wag 1.15s ease-in-out infinite; }
    .blink { transform-box: fill-box; transform-origin: center; animation: blink 4.8s infinite; }
    @keyframes bob { 50% { transform: translateY(-3px); } }
    @keyframes wag { 50% { transform: rotate(14deg); } }
    @keyframes blink { 0%,42%,48%,100% { transform: scaleY(1);} 45% { transform: scaleY(.12);} }
    @media (prefers-reduced-motion: reduce) { .bob,.wag,.blink { animation: none; } }
  </style>
  <rect width="120" height="140" rx="28" fill="#12182e"/>
  <g class="bob"><path d="M34 64 42 30 54 60Z" fill="#ffe600"/><path d="M86 64 78 30 66 60Z" fill="#ffe600"/>
    <ellipse cx="60" cy="104" rx="28" ry="22" fill="#f3e6d4"/><circle cx="60" cy="74" r="26" fill="#f3e6d4"/>
    <ellipse cx="60" cy="86" rx="10" ry="7" fill="#f7f4ea"/>
    <g class="blink"><ellipse cx="50" cy="72" rx="3.5" ry="4.5" fill="#1a2436"/><ellipse cx="70" cy="72" rx="3.5" ry="4.5" fill="#1a2436"/></g></g>
    <g class="wag"><path d="M86 112c16 2 22-16 12-22" fill="none" stroke="#ffe600" stroke-width="6" stroke-linecap="round"/></g>
</svg>